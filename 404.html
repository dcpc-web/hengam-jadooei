<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Loading…</title>
  <script>
  (function () {
    var path = window.location.pathname;
    var query = window.location.search;
    var hash = window.location.hash;
    var target = "/?p=" + encodeURIComponent(path) + "&q=" + encodeURIComponent(query.slice(1)) + (hash ? "&h=" + encodeURIComponent(hash.slice(1)) : "");
    window.location.replace(target);
  }());
  </script>
</head>
<body>در حال بارگذاری…</body>
</html>
